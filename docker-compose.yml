# docker-compose.yml – 3 services: db, backend, frontend
# Run with: docker compose up --build
# No edits needed if you copied .env.example to .env

services:
  # ── MongoDB ──────────────────────────────────────────────────────────────
  db:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    # Host port 27018 avoids clashing with a MongoDB already installed locally
    ports:
      - "27018:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ── Backend ───────────────────────────────────────────────────────────────
  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://db:27017/blood_donation
      JWT_SECRET: ${JWT_SECRET:-changeme_at_least_16_chars_long}
      PORT: 5000
      NODE_ENV: production
      CLIENT_URL: http://localhost:3000,http://localhost:5173

  # ── Frontend ──────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5000/api
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo_data: